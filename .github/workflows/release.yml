name: Restaurant Api CD

on:
  push:
    branches: [master]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Publish
        run: dotnet publish ./src/Restaurants.API/Restaurants.API.csproj -c Release -o ./publish --no-build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-artifact
          path: ./publish


  deploy-dev:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: api-artifact
          path: ./publish

      - name: Deploy to Dev
        uses: Azure/webapps-deploy@v2.2.19
        with:
          app-name: restaurants-api-dev
          publish-profile: ${{ secrets.PUBLISH_PROFILE_DEV }}
          package: ./publish


  deploy-prod:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: api-artifact
          path: ./publish

      - name: Deploy to Prod
        uses: Azure/webapps-deploy@v2.2.19
        with:
          app-name: restaurants-api-prod
          publish-profile: ${{ secrets.PUBLISH_PROFILE_PROD }}
          package: ./publish
