name: Restaurant Api

on: 
  push: 
   branches: [master]
  pull_request:
    branches: [master]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 8.0.x
      - name: Restore Dependancies
        run: dotnet restore
      - name: Build
        run: dotnet build --mo-restore
      - name: Test
        run: dotnet test

      
